<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radar Digital · DEVELON Chile</title>
  <style>
    :root {
      --bg: #f6f1ea;
      --surface: #fffaf5;
      --ink: #251a17;
      --muted: #6e5a54;
      --line: rgba(37,26,23,0.10);
      --accent: #b74f2a;
      --accent-soft: rgba(183,79,42,0.08);
      --gold: #d59b31;
      --gold-soft: rgba(213,155,49,0.12);
      --green: #1D9E75;
      --green-soft: rgba(29,158,117,0.10);
      --purple: #534AB7;
      --purple-soft: rgba(83,74,183,0.08);
      --teal: #0F6E56;
      --teal-soft: rgba(15,110,86,0.08);
      --shadow-sm: 0 2px 8px rgba(76,43,31,0.06);
      --shadow: 0 8px 30px rgba(76,43,31,0.08);
      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 20px;
      --r-xl: 28px;
    }
    *{box-sizing:border-box;margin:0;}
    html{scroll-behavior:smooth;}
    body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#fcf7f1 0%,#f4eee7 100%);-webkit-font-smoothing:antialiased;}
    .page{width:min(1200px,calc(100% - 32px));margin:0 auto;padding:20px 0 72px;}
    h1{font-size:clamp(30px,4.5vw,52px);line-height:1;letter-spacing:-0.04em;margin-top:14px;}
    h2{font-size:clamp(22px,3vw,34px);line-height:1.05;letter-spacing:-0.03em;}
    h3{font-size:18px;letter-spacing:-0.02em;}

    /* Nav */
    .nav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:18px;padding:10px 14px;border-radius:var(--r-md);background:rgba(255,250,245,0.92);border:1px solid var(--line);backdrop-filter:blur(16px);position:sticky;top:8px;z-index:100;}
    .nav a{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;transition:all 0.2s;}
    .nav a:hover{color:var(--accent);background:var(--accent-soft);}
    .nav a.nav-ig{color:#E4405F;}
    .nav a.nav-ig:hover{background:rgba(228,64,95,0.08);}
    .nav a.nav-li{color:#0A66C2;}
    .nav a.nav-li:hover{background:rgba(10,102,194,0.08);}
    .nav a.nav-meta{color:#0081FB;}
    .nav a.nav-meta:hover{background:rgba(0,129,251,0.08);}
    .nav-sep{width:1px;height:20px;background:var(--line);margin:0 6px;align-self:center;}
    .nav-icon{width:14px;height:14px;vertical-align:-2px;margin-right:3px;}

    /* Section dividers */
    .section-divider{margin:36px 0 24px;padding:20px 24px;border-radius:var(--r-xl);display:flex;align-items:center;gap:12px;}
    .section-divider.ig{background:linear-gradient(135deg,rgba(228,64,95,0.06) 0%,rgba(252,175,69,0.06) 100%);border:1px solid rgba(228,64,95,0.15);}
    .section-divider.li{background:rgba(10,102,194,0.04);border:1px solid rgba(10,102,194,0.12);}
    .section-divider.meta{background:rgba(0,129,251,0.04);border:1px solid rgba(0,129,251,0.12);}
    .section-divider.industry{background:rgba(37,26,23,0.03);border:1px solid var(--line);}
    .section-divider-icon{width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .section-divider-icon.ig{background:rgba(228,64,95,0.1);}
    .section-divider-icon.li{background:rgba(10,102,194,0.1);}
    .section-divider-icon.meta{background:rgba(0,129,251,0.1);}
    .section-divider-icon.industry{background:rgba(37,26,23,0.06);}
    .section-divider-icon img{width:22px;height:22px;}
    .section-divider h2{font-size:clamp(20px,2.5vw,28px);letter-spacing:-0.03em;}
    .section-divider p{color:var(--muted);font-size:13px;margin-top:2px;}

    /* Cards */
    .card{padding:24px;border:1px solid var(--line);border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--shadow-sm);}
    .grid{display:grid;gap:14px;}
    .g2{grid-template-columns:repeat(2,minmax(0,1fr));}
    .g3{grid-template-columns:repeat(3,minmax(0,1fr));}
    .g4{grid-template-columns:repeat(4,minmax(0,1fr));}
    .section{margin-top:24px;}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px;}
    .section-head p{max-width:560px;color:var(--muted);font-size:14px;line-height:1.5;}

    /* Hero */
    .hero{padding:28px 30px;border:1px solid var(--line);border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--shadow);margin-bottom:20px;}
    .pill{display:inline-block;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;}
    .pill.purple{color:var(--purple);background:var(--purple-soft);}
    .pill.accent{color:var(--accent);background:var(--accent-soft);}
    .pill.green{color:var(--green);background:var(--green-soft);}
    .pill.gold{color:#855a0f;background:var(--gold-soft);}
    .pill.teal{color:var(--teal);background:var(--teal-soft);}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px;}
    .metric{padding:16px;border-radius:var(--r-md);background:rgba(37,26,23,0.03);}
    .metric-label{font-size:12px;color:var(--muted);margin-bottom:4px;}
    .metric-value{font-size:26px;font-weight:700;letter-spacing:-0.04em;}
    .metric-sub{font-size:11px;color:var(--muted);margin-top:2px;}

    /* Insights */
    .insight{border-left:3px solid var(--green);padding:10px 0 10px 14px;margin-bottom:10px;}
    .insight:last-child{margin-bottom:0;}
    .insight h4{font-size:14px;font-weight:700;margin-bottom:4px;}
    .insight p{font-size:13px;color:var(--muted);line-height:1.5;}
    .insight.accent{border-left-color:var(--accent);}
    .insight.gold{border-left-color:var(--gold);}
    .insight.purple{border-left-color:var(--purple);}
    .insight.li{border-left-color:#0A66C2;}

    /* Rank */
    .rank-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
    .rank-row:last-of-type{border-bottom:none;}
    .rank-pos{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;background:rgba(37,26,23,0.06);color:var(--muted);flex-shrink:0;}
    .rank-pos.gold{background:#FFF4D6;color:#9A7100;}
    .rank-info{flex:1;min-width:0;}
    .rank-name{font-weight:700;font-size:14px;}
    .rank-handle{font-size:12px;color:var(--muted);text-decoration:none;}
    .rank-bar-wrap{width:20%;height:8px;background:rgba(37,26,23,0.05);border-radius:99px;overflow:hidden;}
    .rank-bar{height:100%;border-radius:99px;background:var(--accent);transition:width 0.6s ease;}
    .rank-count{font-size:15px;font-weight:700;min-width:60px;text-align:right;}

    /* Table */
    .cmp-scroll{overflow-x:auto;}
    .cmp-table{width:100%;border-collapse:collapse;font-size:13px;}
    .cmp-table th{text-align:left;font-weight:700;padding:8px 14px;border-bottom:2px solid var(--line);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;}
    .cmp-table td{padding:10px 14px;border-bottom:1px solid var(--line);}
    .cmp-table tr:last-child td{border-bottom:none;}

    /* Recs */
    .rec-item{padding:12px 0;border-bottom:1px solid var(--line);}
    .rec-item:last-child{border-bottom:none;}
    .rec-item-top{display:flex;align-items:center;gap:8px;}
    .rec-item h4{font-size:14px;flex:1;}
    .rec-item p{font-size:13px;color:var(--muted);line-height:1.5;margin-top:4px;}

    /* Logos */
    .brand-logo{border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--line);}
    .brand-logo.sm{width:32px;height:32px;}
    .brand-logo.lg{width:48px;height:48px;}
    .platform-icon{width:14px;height:14px;vertical-align:-2px;}

    /* Tags */
    .meta-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
    .meta-tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;}
    .meta-tag.li{background:rgba(10,102,194,0.08);color:#0A66C2;}
    .meta-tag.meta{background:rgba(0,129,251,0.08);color:#0081FB;}
    .meta-tag.gold{background:var(--gold-soft);color:#855a0f;}

    /* LinkedIn post cards */
    .li-post-card{display:flex;gap:12px;padding:12px;margin-bottom:8px;border-radius:var(--r-sm);border:1px solid var(--line);text-decoration:none;color:inherit;transition:all 0.15s;}
    .li-post-card:hover{border-color:rgba(10,102,194,0.3);box-shadow:0 2px 8px rgba(10,102,194,0.08);}
    .li-post-logo{width:48px;height:48px;border-radius:6px;object-fit:contain;flex-shrink:0;background:#fff;border:1px solid var(--line);padding:4px;}
    .li-post-body{flex:1;min-width:0;}
    .li-post-body h4{font-size:13px;margin-bottom:4px;font-weight:700;}
    .li-post-body p{font-size:12px;color:var(--muted);line-height:1.4;}
    .li-post-brand{font-size:11px;color:#0A66C2;font-weight:600;margin-bottom:4px;}

    /* Meta Ads */
    .meta-ads-brand{padding:20px;border:1px solid var(--line);border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--shadow-sm);}
    .meta-ads-brand.has-ads{border-color:rgba(0,129,251,0.2);}
    .meta-ads-status{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0.03em;}
    .meta-ads-status.active{color:#0081FB;background:rgba(0,129,251,0.08);}
    .meta-ads-status-dot{width:8px;height:8px;border-radius:50%;}
    .meta-ads-status.active .meta-ads-status-dot{background:#00C853;box-shadow:0 0 6px rgba(0,200,83,0.4);}
    .meta-ads-notes{margin-top:12px;padding:0;list-style:none;}
    .meta-ads-notes li{position:relative;padding:8px 0 8px 18px;font-size:14px;line-height:1.5;color:var(--muted);border-bottom:1px solid var(--line);}
    .meta-ads-notes li:last-child{border-bottom:none;}
    .meta-ads-notes li::before{content:'';position:absolute;left:0;top:14px;width:6px;height:6px;border-radius:50%;background:#0081FB;}
    .li-notes li::before{background:#0A66C2 !important;}
    .meta-ads-cta-btn{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:10px 18px;border-radius:var(--r-sm);background:#0081FB;color:#fff;text-decoration:none;font-size:13px;font-weight:600;transition:all 0.2s;}
    .meta-ads-cta-btn:hover{background:#006ad4;box-shadow:0 4px 12px rgba(0,129,251,0.25);}
    .li-ads-cta-btn{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:10px 18px;border-radius:var(--r-sm);background:#0A66C2;color:#fff;text-decoration:none;font-size:13px;font-weight:600;transition:all 0.2s;}
    .li-ads-cta-btn:hover{background:#085298;box-shadow:0 4px 12px rgba(10,102,194,0.25);}

    /* Embed */
    .embed-shell{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:#fff;}
    .embed-shell iframe{width:100%;border:none;min-height:620px;}
    .embed-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
    .embed-tab{padding:7px 18px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:all 0.15s;}
    .embed-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}

    /* Ad categories */
    .ad-cat{padding:10px 0;border-bottom:1px solid var(--line);}
    .ad-cat:last-child{border-bottom:none;}
    .ad-cat-top{display:flex;gap:6px;align-items:center;margin-bottom:4px;}
    .ad-cat h4{font-size:14px;font-weight:700;flex:1;}
    .ad-cat p{font-size:13px;color:var(--muted);line-height:1.4;}
    .format-pill{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(10,102,194,0.08);color:#0A66C2;}
    .obj-pill{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:var(--green-soft);color:var(--teal);}

    /* LinkedIn Ad card (simulated feed) */
    .li-ad-card{border:1px solid var(--line);border-radius:var(--r-md);background:#fff;overflow:hidden;display:flex;flex-direction:column;}
    .li-ad-header{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;}
    .li-ad-avatar{width:42px;height:42px;border-radius:6px;object-fit:contain;background:#f3f2ef;border:1px solid var(--line);padding:4px;flex-shrink:0;}
    .li-ad-company{flex:1;min-width:0;}
    .li-ad-company-name{font-size:13px;font-weight:700;color:#1a1a1a;line-height:1.2;}
    .li-ad-promo{font-size:11px;color:#666;display:flex;align-items:center;gap:4px;margin-top:2px;}
    .li-ad-promo::before{content:"Promocionado";font-size:11px;color:#666;}
    .li-ad-promo-dot{width:3px;height:3px;border-radius:50%;background:#666;}
    .li-ad-globe{font-size:10px;}
    .li-ad-copy{padding:0 16px 14px;font-size:13px;line-height:1.6;color:#1a1a1a;white-space:pre-line;}
    .li-ad-footer{border-top:1px solid #e0e0e0;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;}
    .li-ad-cta{padding:7px 16px;border-radius:4px;font-size:13px;font-weight:700;color:#0A66C2;border:1.5px solid #0A66C2;background:#fff;cursor:default;}
    .li-ad-tags{display:flex;flex-wrap:wrap;gap:4px;padding:0 16px 12px;}
    .li-ad-group{margin-bottom:24px;}
    .li-ad-group-header{padding:14px 18px;border-radius:var(--r-md) var(--r-md) 0 0;margin-bottom:1px;}
    .li-ad-group-header.green{background:var(--green-soft);border:1px solid rgba(29,158,117,0.2);}
    .li-ad-group-header.accent{background:var(--accent-soft);border:1px solid rgba(183,79,42,0.2);}
    .li-ad-group-header.purple{background:var(--purple-soft);border:1px solid rgba(83,74,183,0.2);}
    .li-ad-group-header.gold{background:var(--gold-soft);border:1px solid rgba(213,155,49,0.2);}
    .li-ad-group-header.muted{background:rgba(37,26,23,0.04);border:1px solid var(--line);}
    .li-ad-group-title{font-size:15px;font-weight:800;letter-spacing:-0.02em;}
    .li-ad-group-title.green{color:var(--teal);}
    .li-ad-group-title.accent{color:var(--accent);}
    .li-ad-group-title.purple{color:var(--purple);}
    .li-ad-group-title.gold{color:#855a0f;}
    .li-ad-group-title.muted{color:var(--ink);}
    .li-ad-group-meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;}
    .li-ad-analysis{padding:12px 16px;background:rgba(10,102,194,0.04);border:1px solid rgba(10,102,194,0.12);border-radius:var(--r-sm);font-size:13px;line-height:1.6;color:var(--ink);}
    .li-ad-analysis-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:#0A66C2;margin-bottom:6px;}
    .li-ads-scroll{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin:12px 0;}

    /* Meta Ad card (simulated feed) */
    .meta-ad-card{border:1px solid #dddfe2;border-radius:8px;background:#fff;overflow:hidden;display:flex;flex-direction:column;}
    .meta-ad-header{display:flex;align-items:center;gap:10px;padding:12px 12px 8px;}
    .meta-ad-avatar{width:40px;height:40px;border-radius:50%;object-fit:contain;background:#f0f2f5;border:1px solid #dddfe2;padding:4px;flex-shrink:0;}
    .meta-ad-company{flex:1;min-width:0;}
    .meta-ad-company-name{font-size:13px;font-weight:700;color:#050505;line-height:1.2;}
    .meta-ad-promo{font-size:11px;color:#65676B;display:flex;align-items:center;gap:4px;margin-top:1px;}
    .meta-ad-copy{padding:0 12px 12px;font-size:13px;line-height:1.6;color:#050505;white-space:pre-line;}
    .meta-ad-img-placeholder{height:8px;background:linear-gradient(90deg,rgba(0,129,251,0.15),rgba(0,129,251,0.05));margin:0 0 2px;}
    .meta-ad-footer{border-top:1px solid #dddfe2;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;}
    .meta-ad-cta{padding:7px 14px;border-radius:6px;font-size:13px;font-weight:700;color:#fff;background:#0081FB;cursor:default;}
    .meta-ad-group{margin-bottom:28px;}
    .meta-ad-analysis{padding:12px 14px;background:rgba(0,129,251,0.05);border:1px solid rgba(0,129,251,0.15);border-radius:var(--r-sm);font-size:13px;line-height:1.6;color:var(--ink);margin-top:10px;}
    .meta-ad-analysis-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:#0081FB;margin-bottom:5px;}
    .meta-ads-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin:16px 0;}

    /* KPI card */
    .kpi-card{padding:18px;border-radius:var(--r-md);background:rgba(37,26,23,0.03);text-align:center;}
    .kpi-value{font-size:32px;font-weight:800;letter-spacing:-0.04em;line-height:1;}
    .kpi-label{font-size:12px;color:var(--muted);margin-top:4px;}
    .kpi-card.accent{background:var(--accent-soft);}
    .kpi-card.green{background:var(--green-soft);}
    .kpi-card.gold{background:var(--gold-soft);}
    .kpi-card.purple{background:var(--purple-soft);}

    /* Profile points */
    .profile-point{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5;color:var(--muted);}
    .profile-point:last-child{border-bottom:none;}
    .profile-point::before{content:"→";color:var(--accent);font-weight:700;flex-shrink:0;}

    /* Note badge */
    .note-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;background:var(--gold-soft);color:#855a0f;font-weight:600;margin-left:6px;}

    /* Responsive */
    @media(max-width:768px){
      .g2,.g3,.g4{grid-template-columns:1fr;}
      .metrics{grid-template-columns:repeat(2,1fr);}
      .embed-shell iframe{min-height:520px;}
    }
    @media(max-width:480px){
      .metrics{grid-template-columns:1fr;}
      h1{font-size:22px;}
    }

    footer{text-align:center;font-size:12px;color:var(--muted);margin-top:48px;padding-top:24px;border-top:1px solid var(--line);}
  </style>
</head>
<body>
<div class="page">
  <nav class="nav" id="nav"></nav>
  <div id="app"></div>
  <footer id="footer"></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
let DATA = {};

const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n);
const fmtFull = n => n ? n.toLocaleString('es-CL') : '—';

function priorityPill(p) {
  if (p === 'alta') return '<span class="pill accent">Alta prioridad</span>';
  return '<span class="pill gold">Prioridad media</span>';
}

function renderNav() {
  return `
    <a href="#sec-perfil">Perfil de marca</a>
    <div class="nav-sep"></div>
    <a class="nav-ig" href="#sec-instagram"><img class="nav-icon" src="icon-instagram.svg" alt="">Instagram</a>
    <div class="nav-sep"></div>
    <a class="nav-li" href="#sec-linkedin"><img class="nav-icon" src="icon-linkedin.svg" alt="">LinkedIn</a>
    <div class="nav-sep"></div>
    <a class="nav-meta" href="#sec-metaads"><img class="nav-icon" src="icon-meta.svg" alt="">Meta Ads</a>
    <a class="nav-li" href="#sec-liads"><img class="nav-icon" src="icon-linkedin.svg" alt="">LinkedIn Ads</a>
  `;
}

function renderHero() {
  const b = DATA.brands[0];
  const li = DATA.linkedin.brands[0];
  return `
    <div class="hero">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
        <img src="${b.logo}" class="brand-logo lg" alt="${b.name}" style="width:64px;height:64px;">
        <div>
          <span class="pill purple">Radar Digital 2026</span>
          <h1 style="margin-top:8px;">DEVELON Chile</h1>
          <p style="color:var(--muted);font-size:15px;margin-top:4px;">HD Construction Equipment Chile S.A. · Maquinaria de Construcción y Minería</p>
        </div>
      </div>
      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Seguidores Instagram</div>
          <div class="metric-value">${fmt(b.followers)}</div>
          <div class="metric-sub">@${b.handle}</div>
        </div>
        <div class="metric">
          <div class="metric-label">Publicaciones IG</div>

              <h4>${item.title}</h4>
              ${priorityPill(item.priority)}
            </div>
            <p>${item.text}</p>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderLiAdCard(ad) {
  return `
    <div class="li-ad-card">
      <div class="li-ad-header">
        <img src="logo-develon.png" class="li-ad-avatar" alt="HD Construction Equipment Chile">
        <div class="li-ad-company">
          <div class="li-ad-company-name">HD Construction Equipment Chile</div>
          <div class="li-ad-promo"></div>
        </div>
      </div>
      <div class="li-ad-copy">${ad.copy}</div>
      <div class="li-ad-tags">
        ${ad.tags.map(t => `<span style="font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(10,102,194,0.08);color:#0A66C2;font-weight:600;">${t}</span>`).join('')}
      </div>
      <div class="li-ad-footer">
        <div style="font-size:11px;color:#666;">ID: ${ad.id}</div>
        <span class="li-ad-cta">${ad.cta}</span>
      </div>
    </div>
  `;
}

function renderLiAdGroup(group) {
  return `
    <div class="li-ad-group">
      <div class="li-ad-group-header ${group.color}">
        <div class="li-ad-group-title ${group.color}">${group.category}</div>
        <div class="li-ad-group-meta">
          <span>📋 ${group.adCount} anuncios</span>
          <span>🎯 ${group.objective}</span>
          <span>🖼️ ${group.format}</span>
          <span>🪝 Hook: ${group.hook}</span>
        </div>
      </div>
      <div class="li-ads-scroll">
        ${group.ads.map(ad => renderLiAdCard(ad)).join('')}
      </div>
      <div class="li-ad-analysis">
        <div class="li-ad-analysis-label">📊 Análisis estratégico del grupo</div>
        ${group.analysis}
      </div>
    </div>
  `;
}

function renderLinkedInAds() {
  const la = DATA.linkedinAds;
  const b = la.brands[0];
  return `
    <div class="section-divider li" id="sec-liads">
      <div class="section-divider-icon li">
        <img src="icon-linkedin.svg" alt="">
      </div>
      <div>
        <h2>LinkedIn Ads · HD Construction Equipment Chile</h2>
        <p>${b.totalAds} anuncios reales · Grupos estratégicos · Análisis de creatividades</p>
      </div>
    </div>

    <!-- Brand header -->
    <div class="card" style="margin-bottom:20px;border-color:rgba(10,102,194,0.2);">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <img src="${b.logo}" class="brand-logo lg" alt="${b.name}">
        <div>
          <div style="font-weight:700;font-size:16px;">${b.name}</div>
          <div style="font-size:12px;color:var(--muted);">Anunciante: ${b.advertiserName}</div>
        </div>
        <div style="margin-left:auto;">
          <span class="meta-ads-status active" style="color:#0A66C2;background:rgba(10,102,194,0.08);">
            <span class="meta-ads-status-dot" style="background:#0A66C2;box-shadow:0 0 6px rgba(10,102,194,0.4);"></span>
            ${b.totalAds} anuncios activos
          </span>
        </div>
      </div>
      <p style="font-size:14px;line-height:1.6;color:var(--muted);margin-top:14px;margin-bottom:16px;">${b.summary}</p>
      <!-- Volume by group -->
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;">
        ${b.adGroups.map(g => {
          const colors = {green:'var(--teal)',accent:'var(--accent)',purple:'var(--purple)',gold:'#855a0f',muted:'var(--muted)'};
          const bgs = {green:'var(--green-soft)',accent:'var(--accent-soft)',purple:'var(--purple-soft)',gold:'var(--gold-soft)',muted:'rgba(37,26,23,0.04)'};
          return `<div style="padding:10px 14px;border-radius:var(--r-sm);background:${bgs[g.color]};color:${colors[g.color]};">
            <div style="font-size:22px;font-weight:800;">${g.adCount}</div>
            <div style="font-size:11px;line-height:1.3;margin-top:2px;">${g.category.split('—')[0].trim()}</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- All ad groups with real ads -->
    <div style="margin-bottom:12px;">
      <h3>Anuncios reales por grupo estratégico</h3>
      <p style="font-size:13px;color:var(--muted);margin-top:4px;">Creatividades extraídas directamente de la Biblioteca de Anuncios de LinkedIn. Cada grupo incluye las variantes reales y su análisis.</p>
    </div>
    ${b.adGroups.map(g => renderLiAdGroup(g)).join('')}

    <!-- Strategy notes -->
    <div class="card" style="margin-bottom:14px;">
      <h3 style="margin-bottom:12px;">Notas estratégicas · LinkedIn Ads</h3>
      <ul class="meta-ads-notes li-notes">
        ${b.strategyNotes.map(n => `<li>${n}</li>`).join('')}
      </ul>
    </div>

    <!-- Conclusions + Recs -->
    <div class="grid g2" style="margin-bottom:14px;">
      <div class="card">
        <h3 style="margin-bottom:14px;">Conclusiones LinkedIn Ads</h3>
        ${la.conclusions.map(i => `
          <div class="insight li">
            <h4>${i.title}</h4>
            <p>${i.text}</p>
          </div>
        `).join('')}
      </div>
      <div class="card">
        <h3 style="margin-bottom:14px;">Recomendaciones LinkedIn Ads</h3>
        ${la.recommendations.map(item => `
          <div class="rec-item">
            <div class="rec-item-top">
              <h4>${item.title}</h4>
              ${priorityPill(item.priority)}
            </div>
            <p>${item.text}</p>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function switchTab(tab, section) {
  document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.embed-tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).style.display = '';
  event.target.classList.add('active');
}

function render() {
  document.getElementById('nav').innerHTML = renderNav();
  document.getElementById('app').innerHTML = [
    renderHero(),
    renderPerfil(),
    renderInstagram(),
    renderLinkedIn(),
    renderMetaAds(),
    renderLinkedInAds()
  ].join('');
  document.getElementById('footer').innerHTML = `
    Datos extraídos públicamente · ${DATA.meta.extractionDate} · ${DATA.meta.industry} · ${DATA.meta.market}
    <br><span style="opacity:0.5;">Para actualizar, modifica data.json y recarga la página · Sirve localmente con: <code>python3 -m http.server 8080</code></span>
  `;
}

function renderCharts() {
  const b = DATA.brands[0];
  const ctx = document.getElementById('igMetricsChart');
  if (!ctx) return;
  new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['Likes prom.', 'Comentarios prom.'],
      datasets: [{
        data: [b.avgLikes, b.avgComments],
        backgroundColor: ['#b74f2a', '#d59b31'],
        borderWidth: 0,
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 12 }, color: '#6e5a54' } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.raw}` } }
      },
      cutout: '65%'
    }
  });
}

async function init() {
  const r = await fetch('data.json');
  DATA = await r.json();
  render();
  setTimeout(() => renderCharts(), 100);
}
init();
</script>
</body>
</html>
